name: C Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Build and run unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GymMS

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application
        run: make

      - name: Run unit tests
        run: make test
